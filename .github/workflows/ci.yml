name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect project type
        id: project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "type=node" >> "$GITHUB_OUTPUT"
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "type=python" >> "$GITHUB_OUTPUT"
          elif [ -f pom.xml ]; then
            echo "type=maven" >> "$GITHUB_OUTPUT"
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "type=gradle" >> "$GITHUB_OUTPUT"
          elif [ -f go.mod ]; then
            echo "type=go" >> "$GITHUB_OUTPUT"
          elif [ -f Cargo.toml ]; then
            echo "type=rust" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.project.outputs.type == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Node dependencies
        if: steps.project.outputs.type == 'node'
        run: npm ci

      - name: Test Node project
        if: steps.project.outputs.type == 'node'
        run: npm test -- --runInBand

      - name: Build Node project
        if: steps.project.outputs.type == 'node'
        run: npm run build

      - name: Set up Python
        if: steps.project.outputs.type == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        if: steps.project.outputs.type == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          python -m pip install pytest build
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi

      - name: Test Python project
        if: steps.project.outputs.type == 'python'
        run: python -m pytest

      - name: Build Python project
        if: steps.project.outputs.type == 'python'
        run: python -m build

      - name: Set up Java
        if: steps.project.outputs.type == 'maven' || steps.project.outputs.type == 'gradle'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Test and build Maven project
        if: steps.project.outputs.type == 'maven'
        run: mvn --batch-mode verify

      - name: Test and build Gradle project
        if: steps.project.outputs.type == 'gradle'
        run: |
          if [ -x ./gradlew ]; then ./gradlew build; else gradle build; fi

      - name: Set up Go
        if: steps.project.outputs.type == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Test and build Go project
        if: steps.project.outputs.type == 'go'
        run: |
          go test ./...
          go build ./...

      - name: Set up Rust
        if: steps.project.outputs.type == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Test and build Rust project
        if: steps.project.outputs.type == 'rust'
        run: |
          cargo test --locked
          cargo build --locked --release

      - name: Validate repository
        if: steps.project.outputs.type == 'none'
        run: |
          test -f README.md
          echo "No recognized build system is present; repository documentation is valid."
